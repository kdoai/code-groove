name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secrets:
    name: Secret scan
    uses: ./.github/workflows/secrets.yml
  verify:
    name: Verify code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.6.11'
          python-version: '3.13'
      - run: npm install -g pnpm@10.27.0
      - run: pnpm install --frozen-lockfile && uv sync --frozen
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select tests from changed paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            pnpm test:changed --all
          else
            pnpm test:changed --base "$BASE"
          fi
  deploy:
    name: Deploy production
    needs: [verify, secrets]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
