<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7587ac" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#253044}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#64738b}.label{font-size:23px;font-weight:600}.small{font-size:17px;fill:#596982}.box{fill:#fff;stroke:#d4dbea;stroke-width:2;rx:12}.line{fill:none;stroke:#7587ac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="920" fill="#f7f8fc"/><text x="60" y="72" class="title">Code Groove / Why this rhythm?</text><text x="60" y="110" class="sub">The Agent judges code. The deterministic compiler composes. The player reveals the evidence.</text><rect x="60" y="190" width="375" height="240" class="box"/><text x="82" y="229" class="label">1 / Agent interpretation</text><text x="82" y="263" class="small">Read exact functions + context</text><text x="82" y="291" class="small">Ask: same reason to change?</text><text x="82" y="319" class="small">Check alternative contracts</text><text x="82" y="347" class="small">Concern / justified / unknown</text><text x="82" y="375" class="small">Concrete hypothetical change</text><rect x="525" y="190" width="380" height="240" class="box"/><text x="547" y="229" class="label">2 / Musical arrangement</text><text x="547" y="263" class="small">Same M0-M5 identity / data notes</text><text x="547" y="291" class="small">Four-bar question and answer</text><text x="547" y="319" class="small">Rootless voicing / walking bass</text><text x="547" y="347" class="small">2:1 swing, explicit rests</text><text x="547" y="375" class="small">Fixed evidence-linked echo cues</text><rect x="995" y="190" width="385" height="240" class="box"/><text x="1017" y="229" class="label">3 / DTM workspace</text><text x="1017" y="263" class="small">Repository directory tree</text><text x="1017" y="291" class="small">File/function clips + all notes</text><text x="1017" y="319" class="small">Separate common backing tracks</text><text x="1017" y="347" class="small">Audible note -&gt; exact file lines</text><text x="1017" y="375" class="small">Always available Agent questions</text><path d="M435 305 L525 305" class="line"/><path d="M905 305 L995 305" class="line"/><rect x="60" y="530" width="635" height="210" class="box"/><text x="82" y="569" class="label">Shared decisions / checked concern</text><text x="82" y="603" class="small">Hypothesis: policy window or fee changes</text><text x="82" y="631" class="small">Two code owners must change together</text><text x="82" y="659" class="small">A shifted musical response is added in both clips</text><text x="82" y="687" class="small">Amber ranges link to read evidence; backing is reduced</text><rect x="745" y="530" width="635" height="210" class="box"/><text x="767" y="569" class="label">Independent contracts / justified boundary</text><text x="767" y="603" class="small">Evidence supports separate reasons to change</text><text x="767" y="631" class="small">No diagnostic response is added</text><text x="767" y="659" class="small">Same musical vocabulary and deterministic accompaniment</text><text x="767" y="687" class="small">No concern is not a safety guarantee or a quality score</text><text x="60" y="840" class="sub">Accompaniment is musical context, not a code claim. Unread code gets no invented events. Scores and kits have stable hashes.</text></svg>